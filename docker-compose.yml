# Default mode: GUI displayed on the host X server through the shared X11 socket (Linux host)
# Start with: xhost +local:docker && docker compose up -d
services:
  autopsy:
    build: .
    image: autopsy:latest
    container_name: autopsy
    shm_size: "2gb"
    environment:
      - DISPLAY=${DISPLAY}
      - JAVA_TOOL_OPTIONS=-Dawt.useSystemAAFontSettings=on -Dswing.aatext=true -Dswing.defaultlaf=com.sun.java.swing.plaf.gtk.GTKLookAndFeel
    volumes:
      - "/tmp/.X11-unix:/tmp/.X11-unix"
      - "./case/:/home/autopsy/case"
    network_mode: host
    devices:
      - "/dev/dri:/dev/dri"
      # Optional: mount evidence images inside the container with ewfmount (FUSE).
      # Uncomment this line and the cap_add / security_opt blocks below. No privileged mode needed.
      # - "/dev/fuse:/dev/fuse"
    # cap_add:
    #   - SYS_ADMIN
    # security_opt:
    #   - apparmor:unconfined
