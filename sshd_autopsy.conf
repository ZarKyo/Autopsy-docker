# Optional SSH mode (see ssh-entrypoint.sh). Loaded before the main sshd_config, so these values win.
PermitRootLogin no
AllowUsers autopsy
PasswordAuthentication yes
X11Forwarding yes
X11UseLocalhost yes
# Without this, sshd tries to bind the X11 display on ::1 and X forwarding fails in containers without IPv6
AddressFamily inet
